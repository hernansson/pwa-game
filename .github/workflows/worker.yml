# Publica el servidor del juego (worker/index.ts) en Cloudflare cada vez que cambia el código.
# Necesita dos secretos del repositorio:
#   CLOUDFLARE_API_TOKEN  permisos: Workers Scripts (editar) y D1 (editar)
#   ADMIN_EMAIL           mail(s) de administrador, separados por coma. No queda en el código.
# La base de datos D1 "forja-db" se crea sola la primera vez, y su esquema se aplica en cada publicación.
name: Publicar servidor

on:
  push:
    branches: [main, niveles-con-jefe]
    paths: ["worker/**", "src/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency: worker-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER: forja-api
      DB_NAME: forja-db
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en el repositorio."; exit 1; fi
          if [ -z "${{ secrets.ADMIN_EMAIL }}" ]; then echo "::warning::Falta el secreto ADMIN_EMAIL: nadie va a ser administrador."; fi

      - name: Cuenta y base de datos
        id: cfg
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          B=https://api.cloudflare.com/client/v4
          ACC=$(api "$B/accounts?per_page=50" | jq -r '.result[0].id')
          echo "Cuenta: ${ACC:0:6}…"
          DB=$(api "$B/accounts/$ACC/d1/database?name=$DB_NAME" | jq -r --arg n "$DB_NAME" '[.result[] | select(.name==$n) | .uuid][0] // empty') || {
            echo "::error::El token no puede leer D1. En Cloudflare, editá el token y agregale el permiso 'D1: Edit'."; exit 1; }
          if [ -z "$DB" ]; then
            echo "Creando la base de datos $DB_NAME…"
            DB=$(api -X POST "$B/accounts/$ACC/d1/database" -d "{\"name\":\"$DB_NAME\"}" | jq -r '.result.uuid')
          fi
          echo "D1 $DB_NAME: ${DB:0:8}…"
          SUB=$(api "$B/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          {
            echo "name = \"$WORKER\""
            echo "main = \"worker/index.ts\""
            echo "account_id = \"$ACC\""
            echo "compatibility_date = \"2026-10-01\""
            echo "workers_dev = true"
            echo "keep_vars = true"
            echo ""
            echo "[[d1_databases]]"
            echo "binding = \"DB\""
            echo "database_name = \"$DB_NAME\""
            echo "database_id = \"$DB\""
          } > wrangler.toml
          echo "account=$ACC" >> "$GITHUB_OUTPUT"
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"

      - name: Aplicar el esquema de la base
        run: npx -y wrangler@4 d1 execute "$DB_NAME" --remote --file worker/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cfg.outputs.account }}

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cfg.outputs.account }}
          wranglerVersion: "4.160.1"
          command: deploy
          secrets: |
            ADMIN_EMAIL
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      - name: Probar que responde
        run: |
          U="https://$WORKER.${{ steps.cfg.outputs.sub }}.workers.dev"
          sleep 5
          echo "::notice title=Servidor::$U → $(curl -sS "$U/health")"
          echo "::notice title=Sin sesión (debe ser 401)::$(curl -sS -o /dev/null -w '%{http_code}' "$U/state")"
